name = "pew2-relay"
main = "src/index.ts"

# Must be >= 2026-04-07 so the runtime auto-replies to WebSocket Close frames.
compatibility_date = "2026-06-01"

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "PairingRoom"

# SQLite-backed Durable Objects are the only kind available on the Workers Free
# plan. The room keeps no log of its own: it forwards sealed frames and stores
# nothing, so a pairing that goes quiet leaves no rows behind.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingRoom"]

[observability]
enabled = true

# APNs VoIP push (POST /voip). The signing key itself is the secret APNS_KEY
# (`wrangler secret put APNS_KEY` with the .p8 PEM text); these are not secret.
[vars]
APNS_KEY_ID = "G9J85F9X9S"
APNS_TEAM_ID = "396M7LY29W"
APNS_BUNDLE_ID = "io.github.kenkaiii.pew2"
